name: Market Opportunity Check Cron

# ==============================================================================
# ISTRUZIONI PER LA CONFIGURAZIONE DEI SEGRETI SU GITHUB:
# ==============================================================================
# Per consentire a questo workflow di autenticarsi con il tuo endpoint protetto:
# 1. Apri la pagina del repository su GitHub.
# 2. Vai su: Settings → Secrets and variables → Actions.
# 3. Nella sezione "Repository secrets", clicca sul pulsante "New repository secret".
# 4. Crea i seguenti segreti:
#    - Name: CRON_SECRET
#      Secret: Inserisci lo stesso valore impostato su Vercel (o .env.local).
#
#    - Name: APP_URL (Consigliato per evitare di hardcodare l'URL nel file)
#      Secret: https://tuo-dominio.vercel.app (sostituisci con l'URL del tuo deployment Vercel)
# ==============================================================================

on:
  schedule:
    # Esecuzione ogni 5 minuti TUTTI i giorni della settimana (24/7)
    # Il controllo sullo stato del mercato (aperto/chiuso) viene gestito
    # direttamente dall'API come primissimo step a costo zero.
    # Sintassi: [minuto: */5] [ora: *] [giorno del mese: *] [mese: *] [giorno della settimana: *]
    - cron: "*/5 * * * *"

  # Permette di testare o eseguire il workflow manualmente dalla scheda "Actions" di GitHub
  workflow_dispatch:

jobs:
  check-market:
    name: Check Market Opportunity
    runs-on: ubuntu-latest

    steps:
      - name: Trigger /api/check-market Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          # Se APP_URL è definito nei secrets viene usato, altrimenti sostituisci <tuo-dominio-vercel>
          BASE_URL="${APP_URL:-https://<tuo-dominio-vercel>}"
          ENDPOINT="${BASE_URL%/}/api/check-market"

          echo "Inoltro richiesta GET a: $ENDPOINT"

          # Esegue la chiamata HTTP GET passando l'header segreto di autorizzazione
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "User-Agent: GitHub-Actions-Market-Cron/1.0" \
            --connect-timeout 15 \
            --max-time 60)

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Risposta Endpoint:"
          echo "$HTTP_BODY"

          # Se lo status non è 200 OK, segnala l'errore nel log di GitHub Actions
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Richiesta fallita con codice HTTP $HTTP_STATUS. Verifica CRON_SECRET e lo stato dell'app."
            exit 1
          fi
